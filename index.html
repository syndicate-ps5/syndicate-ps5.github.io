<!DOCTYPE html>
<html lang="de" data-title-de="SYNDICATE" data-title-en="SYNDICATE">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SYNDICATE</title>
    <meta name="description" content="SYNDICATE. Eingang zur Research Division." data-description-de="SYNDICATE. Eingang zur Research Division." data-description-en="SYNDICATE. Entry to the Research Division.">
    <link rel="icon" href="assets/img/mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
      try {
        var stored = localStorage.getItem("syndicate-lang");
        if (stored === "en" || stored === "de") {
          document.documentElement.lang = stored;
          var earlyMeta = document.querySelector('meta[name="description"]');
          if (earlyMeta) {
            var earlyText = earlyMeta.getAttribute(stored === "en" ? "data-description-en" : "data-description-de");
            if (earlyText) earlyMeta.setAttribute("content", earlyText);
          }
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <canvas class="rain" aria-hidden="true"></canvas>
    <a class="skip" href="#inhalt"><span data-lang="de">Zum Inhalt</span><span data-lang="en">Skip to content</span></a>
    <main class="gate" id="inhalt">
      <h1 class="gate-title">SYNDICATE</h1>
      <p class="gate-sub">Research Division</p>
      <div id="gate-nav" class="gate-menu" role="navigation" data-label-de="Eingang" data-label-en="Entry">
        <button class="gate-btn" type="button" aria-disabled="true"><span data-lang="de">Jailbreak</span><span data-lang="en">Jailbreak</span></button>
        <p class="gate-note"><span data-lang="de">Platzhalter ohne Funktion.</span><span data-lang="en">Placeholder with no function.</span></p>
        <a class="gate-btn" href="dashboard.html"><span data-lang="de">Home</span><span data-lang="en">Home</span></a>
      </div>
      <div class="gate-langs langs" role="group">
        <button class="lang" type="button" data-set-lang="de">DE</button>
        <button class="lang" type="button" data-set-lang="en">EN</button>
      </div>
    </main>
    <script src="assets/js/site.js"></script>
  </body>
</html>
